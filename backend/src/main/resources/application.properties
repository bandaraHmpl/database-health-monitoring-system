server.port=8080

# Set a real secret (32+ chars) in your environment / IntelliJ run config:
#   JWT_SECRET=some-long-random-string-at-least-32-characters
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=480

# Comma-separated list of browser origins allowed to call this API
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
